name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  php_lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint changed PHP files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /dev/null 2>&1; then
              echo "::error file=$f::PHP syntax error"
              php -l "$f" || true
              fail=1
            fi
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './YOURLS-*/*' \
            -not -path './sendgrid-php/*' \
            -print0)
          exit $fail

  determine_version:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set version
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_VAL="${GITHUB_REF#refs/tags/}"
          else
            VERSION_VAL="$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION_VAL}" >> $GITHUB_OUTPUT

  build_image:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [determine_version]
    outputs:
      image_digest: ${{ steps.build-and-push.outputs.digest }}
    env:
      VERSION: ${{ needs.determine_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PUSH_SECRET }}
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        id: build-and-push
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          push: true
          tags: ghcr.io/anthony-bible/mysite:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render_and_deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [determine_version, build_image]
    env:
      VERSION: ${{ needs.determine_version.outputs.version }}
      MAIN_IMAGE_DIGEST: ${{ needs.build_image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Render manifests
        run: |
          set -euo pipefail
          mkdir -p build
          git clone https://github.com/Anthony-Bible/Mysite-deploy.git ./build

          rm -f combined.yaml
          touch combined.yaml
          first_file=true
          if ls k8s/*.yaml 1> /dev/null 2>&1; then
            for f in k8s/*.yaml; do
              if [ "$first_file" = true ]; then
                first_file=false
              else
                echo "---" >> combined.yaml
              fi
              cat "$f" >> combined.yaml
            done
          else
            echo "No YAML files found in k8s/."
            exit 1
          fi

          MAIN_IMAGE_SHA="${MAIN_IMAGE_DIGEST#sha256:}"

          sed -i \
            -e "s/%{VERSION}/${VERSION}/g" \
            -e "s/%{MAIN_IMAGE_SHA}/${MAIN_IMAGE_SHA}/g" \
            combined.yaml

          cp combined.yaml ./build/mysite.yaml

          cd ./build
          git config --local user.email "cd@mysite"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Update manifest to ${VERSION}" -a || echo "No changes to commit in deployment repo."

      - name: Push changes to deploy repo
        uses: ad-m/github-push-action@master
        if: github.event_name == 'push'
        with:
          github_token: ${{ secrets.PUSH_SECRET }}
          repository: "Anthony-Bible/Mysite-deploy"
          directory: ./build
          force: false
          branch: main
